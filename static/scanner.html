<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset QR Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --stroke: #dbe3ee;
        --primary: #1d4ed8;
      }

      body {
        font-family: "Sora", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1000px 600px at -10% -25%, #eaf2ff 0%, rgba(234, 242, 255, 0) 65%),
          radial-gradient(760px 440px at 108% 0%, #f1f5f9 0%, rgba(241, 245, 249, 0) 58%),
          #ffffff;
        min-height: 100vh;
      }

      .mono {
        font-family: "IBM Plex Mono", monospace;
      }

      .orb {
        pointer-events: none;
        position: fixed;
        border-radius: 9999px;
        filter: blur(42px);
        opacity: 0.56;
      }

      .orb-a {
        top: 3rem;
        right: -8rem;
        height: 14rem;
        width: 14rem;
        background: #dbeafe;
      }

      .orb-b {
        bottom: 1rem;
        left: -7rem;
        height: 11rem;
        width: 11rem;
        background: #e2e8f0;
      }

      .info-card,
      .scanner-card {
        border-radius: 24px;
        border: 1px solid var(--stroke);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 22px 45px rgba(15, 23, 42, 0.08);
      }

      .kicker {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #64748b;
      }

      .headline {
        font-size: clamp(1.55rem, 3vw, 2.2rem);
        font-weight: 800;
        line-height: 1.2;
      }

      .subline {
        margin-top: 0.6rem;
        color: #475569;
        font-size: 0.92rem;
        line-height: 1.7;
      }

      .detail-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        border-radius: 9999px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        padding: 0.38rem 0.76rem;
        font-size: 0.72rem;
        font-weight: 700;
        color: #334155;
      }

      #reader {
        width: min(92vw, 420px);
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid #dbe3ee;
        background: #ffffff;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      #reader video {
        border-radius: 14px;
      }

      #reader__dashboard {
        padding: 0.75rem;
        border-top: 1px solid #e2e8f0;
        background: #f8fafc;
      }

      #reader button {
        border-radius: 11px;
        border: 1px solid #d6e0ea;
        background: #ffffff;
        color: #334155;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.4rem 0.7rem;
        transition: all 140ms ease;
      }

      #reader button:hover {
        background: #f1f5f9;
      }

      #reader select,
      #reader input {
        border-radius: 11px;
        border: 1px solid #d6e0ea;
        background: #ffffff;
        padding: 0.38rem 0.65rem;
        font-size: 0.82rem;
        color: #334155;
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        border: 1px solid transparent;
        padding: 0.46rem 0.84rem;
        text-align: center;
        font-size: 0.81rem;
        font-weight: 600;
      }

      .status-ok {
        border-color: #bfdbfe;
        background: #eff6ff;
        color: #1e40af;
      }

      .status-error {
        border-color: #fecaca;
        background: #fef2f2;
        color: #b91c1c;
      }

      .modal-panel {
        border-radius: 22px;
        border: 1px solid #dbe3ee;
        background: #ffffff;
        box-shadow: 0 30px 70px rgba(15, 23, 42, 0.28);
      }

      .modal-tone {
        display: inline-flex;
        align-items: center;
        border-radius: 9999px;
        border: 1px solid transparent;
        padding: 0.26rem 0.62rem;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .modal-tone-success {
        border-color: #bbf7d0;
        background: #f0fdf4;
        color: #15803d;
      }

      .modal-tone-error {
        border-color: #fecaca;
        background: #fef2f2;
        color: #b91c1c;
      }

      .cta-btn {
        width: 100%;
        border-radius: 14px;
        border: 1px solid transparent;
        background: #0f172a;
        color: #ffffff;
        padding: 0.65rem 1rem;
        font-size: 0.88rem;
        font-weight: 700;
        transition: background 180ms ease;
      }

      .cta-btn:hover {
        background: #1e293b;
      }

      @media (max-width: 900px) {
        main {
          max-width: 100%;
          gap: 1rem;
        }

        .info-card,
        .scanner-card {
          box-shadow: 0 16px 30px rgba(15, 23, 42, 0.08);
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 0.75rem;
        }

        .info-card,
        .scanner-card {
          border-radius: 18px;
          padding: 1rem;
        }

        #reader {
          width: min(100%, 360px);
        }

        #reader__dashboard {
          padding: 0.65rem;
        }

        .status-chip {
          width: 100%;
        }

        .modal-panel {
          border-radius: 18px;
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body class="relative overflow-x-hidden px-4 py-8 sm:px-8 lg:py-10">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>

    <main class="relative mx-auto flex min-h-[86vh] w-full max-w-5xl flex-col gap-6 lg:flex-row lg:items-center">
      <section class="info-card w-full p-6 sm:p-7 lg:max-w-md">
        <p class="kicker">Verification Portal</p>
        <h1 class="headline mt-2">Asset QR Authentication</h1>
        <p class="subline">Point your camera at an encrypted asset QR code to verify authenticity in real time.</p>

        <div class="mt-5 flex flex-wrap gap-2">
          <span class="detail-chip">Encrypted Payload</span>
          <span class="detail-chip">Server-Side Verification</span>
          <span class="detail-chip">Tamper Detection</span>
        </div>
      </section>

      <section class="scanner-card w-full p-5 sm:p-7">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-base font-bold text-slate-800">Live Scanner</h2>
          <span class="rounded-full border border-blue-200 bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700">Camera Ready</span>
        </div>

        <div class="flex flex-col items-center">
          <div id="reader"></div>
          <p id="status" class="status-chip status-ok mt-4">Initializing secure scanner...</p>
        </div>
      </section>
    </main>

    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/45 px-4 backdrop-blur-sm">
      <div class="modal-panel w-full max-w-md p-6">
        <div class="mb-2 flex items-center gap-2">
          <span id="modal-tone" class="modal-tone modal-tone-success">Verified</span>
          <h2 id="modal-title" class="text-lg font-bold text-slate-900"></h2>
        </div>
        <p id="modal-message" class="mono mt-3 break-all text-sm text-slate-700"></p>
        <button id="close-modal" class="cta-btn mt-6">Continue Scanning</button>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById("status");
      const modalEl = document.getElementById("modal");
      const modalToneEl = document.getElementById("modal-tone");
      const modalTitleEl = document.getElementById("modal-title");
      const modalMessageEl = document.getElementById("modal-message");
      const closeModalBtn = document.getElementById("close-modal");

      const scanner = new Html5Qrcode("reader");
      let isVerifying = false;
      let lastScanValue = "";
      let lastScanAt = 0;
      let userLocation = null;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("status-error", isError);
        statusEl.classList.toggle("status-ok", !isError);
      }

      function showModal(title, message, isSuccess) {
        modalTitleEl.textContent = title;
        modalMessageEl.textContent = message;

        modalToneEl.textContent = isSuccess ? "Verified" : "Warning";
        modalToneEl.classList.toggle("modal-tone-success", isSuccess);
        modalToneEl.classList.toggle("modal-tone-error", !isSuccess);

        modalTitleEl.classList.toggle("text-emerald-700", isSuccess);
        modalTitleEl.classList.toggle("text-rose-700", !isSuccess);

        modalEl.classList.remove("hidden");
        modalEl.classList.add("flex");
      }

      function hideModal() {
        modalEl.classList.add("hidden");
        modalEl.classList.remove("flex");
      }

      function captureCurrentLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("Location access is required to verify this QR."));
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (position) => {
              resolve({
                latitude: Number(position.coords.latitude),
                longitude: Number(position.coords.longitude),
                capturedAt: Date.now()
              });
            },
            (error) => {
              if (error.code === error.PERMISSION_DENIED) {
                reject(new Error("Location access is required to verify this QR."));
                return;
              }
              reject(new Error("Unable to retrieve current location. Please enable location services and retry."));
            },
            { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
          );
        });
      }

      async function ensureFreshLocation() {
        const locationAgeMs = userLocation ? Date.now() - userLocation.capturedAt : Number.POSITIVE_INFINITY;
        if (locationAgeMs < 60000) {
          return userLocation;
        }

        userLocation = await captureCurrentLocation();
        return userLocation;
      }

      async function verifyEncryptedBlob(encryptedBlob, location) {
        const response = await fetch("/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            encrypted_blob: encryptedBlob,
            user_lat: location.latitude,
            user_lon: location.longitude
          })
        });

        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.detail || "Security Warning: Verification failed.");
        }

        return payload;
      }

      function normalizeVerificationErrorMessage(rawMessage) {
        const message = String(rawMessage || "").trim();
        const lowered = message.toLowerCase();

        if (lowered.includes("outside the authorized scanning zone") || lowered.includes("outside the area")) {
          return "Outside the area.";
        }

        if (lowered.includes("maximum scanning limit reached") || lowered.includes("invalid qr")) {
          return "Invalid QR.";
        }

        return message || "Security warning triggered.";
      }

      function normalizeStartupError(error) {
        const message = String((error && error.message) || error || "").trim();
        const lowered = message.toLowerCase();

        if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          return "Camera and location permissions require HTTPS or localhost.";
        }

        if (lowered.includes("permission") || lowered.includes("notallowederror") || lowered.includes("denied")) {
          return "Camera permission denied. Please allow camera access and retry.";
        }

        if (lowered.includes("secure") || lowered.includes("https")) {
          return "Camera access requires HTTPS or localhost.";
        }

        return message || "Unable to start camera scanner.";
      }

      async function onScanSuccess(decodedText) {
        const now = Date.now();
        if (isVerifying) {
          return;
        }

        if (decodedText === lastScanValue && now - lastScanAt < 3000) {
          return;
        }

        isVerifying = true;
        lastScanValue = decodedText;
        lastScanAt = now;

        try {
          setStatus("Encrypted payload captured. Verifying with location...");
          const location = await ensureFreshLocation();
          const payload = await verifyEncryptedBlob(decodedText, location);
          showModal("Success", `Actual ID: ${payload.original_id}`, true);
          setStatus("Verified. Ready for next asset.");
        } catch (error) {
          const userMessage = normalizeVerificationErrorMessage(error && error.message);
          showModal("Security Warning", userMessage, false);
          setStatus(userMessage, true);
        } finally {
          setTimeout(() => {
            isVerifying = false;
          }, 1200);
        }
      }

      function onScanFailure() {
        return;
      }

      function getResponsiveScannerConfig() {
        const base = Math.min(window.innerWidth, window.innerHeight);
        const qrSide = Math.max(180, Math.min(300, Math.floor(base * 0.42)));
        const fps = window.innerWidth < 640 ? 8 : 10;

        return {
          fps,
          qrbox: { width: qrSide, height: qrSide }
        };
      }

      async function startScannerWithFallback() {
        const scannerConfig = getResponsiveScannerConfig();

        try {
          await scanner.start(
            { facingMode: "environment" },
            scannerConfig,
            onScanSuccess,
            onScanFailure
          );
          setStatus("Camera active. Scan an encrypted QR code.");
        } catch (primaryError) {
          try {
            const cameras = await Html5Qrcode.getCameras();
            if (!cameras.length) {
              throw new Error("No camera found on this device.");
            }

            await scanner.start(
              cameras[0].id,
              scannerConfig,
              onScanSuccess,
              onScanFailure
            );
            setStatus("Camera active. Scan an encrypted QR code.");
          } catch (fallbackError) {
            const startupMessage = normalizeStartupError(fallbackError);
            showModal("Camera Error", startupMessage, false);
            setStatus(startupMessage, true);
          }
        }
      }

      async function initializeScanner() {
        if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          const secureContextMessage = "Camera and location permissions require HTTPS or localhost.";
          showModal("Secure Context Required", secureContextMessage, false);
          setStatus(secureContextMessage, true);
          return;
        }

        await startScannerWithFallback();

        try {
          setStatus("Requesting location permission...");
          userLocation = await captureCurrentLocation();
          setStatus("Camera active. Scan an encrypted QR code.");
        } catch (error) {
          const message = error.message || "Location permission not granted. Enable location to verify QRs.";
          showModal("Location Required", message, false);
          setStatus("Camera active. Location will be requested when verifying.", false);
        }
      }

      closeModalBtn.addEventListener("click", () => {
        hideModal();
        if (userLocation) {
          setStatus("Camera active. Scan an encrypted QR code.");
        }
      });

      modalEl.addEventListener("click", (event) => {
        if (event.target === modalEl) {
          hideModal();
          if (userLocation) {
            setStatus("Camera active. Scan an encrypted QR code.");
          }
        }
      });

      initializeScanner();
    </script>
  </body>
</html>
